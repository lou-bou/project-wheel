<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Whirl</title>
    <meta name="description" content="A backlog of project ideas and a wheel that picks what to build next." />
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- use-credentials: without it Cloudflare Access can block the manifest request -->
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
    <meta name="theme-color" content="#FBF7F0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1F2430" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Whirl" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="preload" href="/fonts/dm-sans-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      // Runs before first paint so the page never flashes the wrong theme.
      // No data-theme means follow the OS. The colours mirror --surface and --bg in tokens.css.
      window.setWhirlTheme = function (theme) {
        var root = document.documentElement;
        if (theme === 'light' || theme === 'dark') root.dataset.theme = theme;
        else delete root.dataset.theme;
        document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) {
          var own = m.media.indexOf('light') >= 0 ? '#FBF7F0' : '#1F2430';
          m.content = theme === 'light' ? '#FBF7F0' : theme === 'dark' ? '#1F2430' : own;
        });
      };
      try { window.setWhirlTheme(localStorage.getItem('whirl.theme')); } catch { /* storage blocked */ }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- Outside #root so React can't wipe it when it mounts. src/splash.js removes it. -->
    <div id="splash" class="splash" role="img" aria-label="Whirl is loading">
      <div class="splash-bg"></div>
      <svg class="splash-mark" width="96" height="96" viewBox="0 0 160 160" aria-hidden="true">
        <g class="splash-whirl">
          <path class="splash-slice" d="M80 86 L80 24 A62 62 0 0 1 133.69 55 Z" fill="var(--brand-amber)"/>
          <path class="splash-slice" d="M80 86 L133.69 55 A62 62 0 0 1 133.69 117 Z" fill="var(--brand-coral)"/>
          <path class="splash-slice" d="M80 86 L133.69 117 A62 62 0 0 1 80 148 Z" fill="var(--brand-teal)"/>
          <path class="splash-slice" d="M80 86 L80 148 A62 62 0 0 1 26.31 117 Z" fill="var(--brand-amber)"/>
          <path class="splash-slice" d="M80 86 L26.31 117 A62 62 0 0 1 26.31 55 Z" fill="var(--brand-coral)"/>
          <path class="splash-slice" d="M80 86 L26.31 55 A62 62 0 0 1 80 24 Z" fill="var(--brand-teal)"/>
        </g>
        <circle class="splash-hub" cx="80" cy="86" r="12" fill="var(--pointer)"/>
        <g class="splash-pointer">
          <polygon class="splash-flick" points="70,8 90,8 80,30" fill="var(--pointer)"/>
        </g>
      </svg>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
